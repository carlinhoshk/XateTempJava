<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempChat - Erro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .card {
            background: #1a1a2e; border-radius: 16px; padding: 2.5rem; text-align: center;
            max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #e74c3c; }
        p { color: #888; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block; padding: 0.7rem 1.5rem; border-radius: 8px;
            background: #6c5ce7; color: #fff; text-decoration: none; font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: #7c6cf7; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#x26a0;&#xfe0f;</div>
        <h1>Oops!</h1>
        <p th:text="${erro} ?: 'Algo deu errado.'">Algo deu errado.</p>
        <a href="/" class="btn">Voltar ao Início</a>
    </div>
</body>
</html>
